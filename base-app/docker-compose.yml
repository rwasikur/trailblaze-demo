services:
  postgres:
    image: postgres:15-alpine
    container_name: trailblaze-auto-db
    restart: always
    environment:
      - POSTGRES_USER=trailblaze
      - POSTGRES_PASSWORD=trailblazepass
      - POSTGRES_DB=trailblaze
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailblaze"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
    container_name: trailblaze-backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./src/backend:/app
      - /app/node_modules
      - car_images:/app/uploads
    environment:
      - DATABASE_URL=postgres://trailblaze:trailblazepass@postgres:5432/trailblaze
      - DB_HOST=postgres
      - JWT_SECRET=09f633cdb908fe68f43f458db444f801de483a5db2fec1d30679b264c6dbfb1d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
    container_name: trailblaze-frontend
    restart: always
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://backend:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: ./deployment/nginx
      dockerfile: Dockerfile
    container_name: trailblaze_nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pg_data:
  car_images:
