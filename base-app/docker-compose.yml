services:
  postgres:
    image: postgres:15-alpine
    container_name: trailblaze-auto-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=trailblaze
      - POSTGRES_PASSWORD=trailblazepass
      - POSTGRES_DB=trailblaze
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./src/backend
    container_name: trailblaze-backend
    restart: always
    volumes:
      - ./src/backend:/app
      - /app/node_modules
      - car_images:/app/uploads
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://trailblaze:trailblazepass@postgres:5432/trailblaze
      - JWT_SECRET=09f633cdb908fe68f43f458db444f801de483a5db2fec1d30679b264c6dbfb1d
    depends_on:
      - postgres

  frontend:
    build:
      context: ./src/frontend
    container_name: trailblaze-frontend
    restart: always
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
    container_name: trailblaze-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      
volumes:
  pg_data:
  car_images:
